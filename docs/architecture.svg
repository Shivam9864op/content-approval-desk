<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Content Approval Desk architecture</title>
  <desc id="desc">A local content brief is normalized, checked, reviewed, and approved before scheduling. No platform publishing is connected.</desc>
  <rect width="1200" height="420" rx="28" fill="#10131a"/>
  <text x="60" y="62" fill="#79a7ff" font-family="Inter,Arial" font-size="18" font-weight="700">CONTENT APPROVAL DESK · LOCAL REVIEW BOUNDARY</text>
  <g font-family="Inter,Arial" font-size="18" fill="#f5f7fb">
    <rect x="60" y="140" width="190" height="110" rx="16" fill="#171c25" stroke="#3c4c64"/>
    <text x="95" y="182">brief.json</text><text x="95" y="214" fill="#9aa8bb" font-size="14">hooks · captions</text><text x="95" y="236" fill="#9aa8bb" font-size="14">assets · dates</text>
    <rect x="330" y="140" width="190" height="110" rx="16" fill="#171c25" stroke="#3c4c64"/>
    <text x="360" y="182">normalize</text><text x="360" y="214" fill="#9aa8bb" font-size="14">schema + URLs</text><text x="360" y="236" fill="#9aa8bb" font-size="14">accessibility</text>
    <rect x="600" y="140" width="190" height="110" rx="16" fill="#171c25" stroke="#3c4c64"/>
    <text x="638" y="182">lint + collide</text><text x="638" y="214" fill="#9aa8bb" font-size="14">platform limits</text><text x="638" y="236" fill="#9aa8bb" font-size="14">duplicate slots</text>
    <rect x="870" y="140" width="270" height="110" rx="16" fill="#17261f" stroke="#3e8d66"/>
    <text x="916" y="182">review board</text><text x="916" y="214" fill="#9aa8bb" font-size="14">ready · changes · approved</text><text x="916" y="236" fill="#9aa8bb" font-size="14">shareable local link</text>
  </g>
  <g stroke="#79a7ff" stroke-width="3" fill="none"><path d="M250 195h80"/><path d="M520 195h80"/><path d="M790 195h80"/></g>
  <g fill="#79a7ff"><path d="m321 187 16 8-16 8z"/><path d="m591 187 16 8-16 8z"/><path d="m861 187 16 8-16 8z"/></g>
  <text x="60" y="332" fill="#ff8f8f" font-family="Inter,Arial" font-size="16">OUT OF SCOPE: OAuth, passwords, platform APIs, automatic publishing, real customer data</text>
</svg>
